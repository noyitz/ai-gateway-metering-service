<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PriceTag — Sign In</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b0e11;--c1:#181b1f;--c2:#22262c;--bdr:#2c3138;
  --t:#e0e3e8;--t2:#8b949e;--blu:#58a6ff;--grn:#3fb950;
  --red:#f85149;
}
body{background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:var(--c1);border:1px solid var(--bdr);border-radius:12px;padding:40px;width:100%;max-width:420px}
h1{font-size:20px;font-weight:700;margin-bottom:6px}
.subtitle{color:var(--t2);font-size:13px;margin-bottom:28px}
label{display:block;font-size:12px;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
input[type=password]{width:100%;background:var(--c2);border:1px solid var(--bdr);border-radius:6px;padding:10px 12px;color:var(--t);font-size:14px;font-family:monospace;outline:none}
input[type=password]:focus{border-color:var(--blu)}
button{width:100%;margin-top:16px;background:var(--blu);color:#fff;border:none;border-radius:6px;padding:10px;font-size:14px;font-weight:600;cursor:pointer}
button:hover{opacity:.9}
.error{background:rgba(248,81,73,.1);border:1px solid var(--red);border-radius:6px;padding:10px 14px;margin-bottom:18px;font-size:13px;color:var(--red)}
.hint{margin-top:14px;font-size:11px;color:var(--t2);text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>PriceTag</h1>
  <div class="subtitle">Sign in with your MaaS API key</div>
  <div class="error" id="err" style="display:none">Invalid API key. Check your key and try again.</div>
  <form method="POST" action="/login">
    <label for="api_key">API Key</label>
    <input type="password" id="api_key" name="api_key" placeholder="sk-oai-..." autocomplete="off" required autofocus>
    <button type="submit">Sign In</button>
  </form>
  <div class="hint">Your key was provided by your team lead.</div>
</div>
<script>
if(location.search.includes('error=invalid'))document.getElementById('err').style.display='block';
</script>
</body>
</html>
