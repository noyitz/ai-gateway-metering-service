<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PriceTag · Compression</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0d10;--c1:#12161d;--c2:#1a1f2a;--bdr:#2a3242;--t:#e4e8ee;--t2:#7a8aa0;--blu:#4a9ef5;--grn:#3dcc6e;--cyn:#3ad4c2;--red:#e8554e}
body{background:var(--bg);color:var(--t);font-family:'Inter',-apple-system,sans-serif;margin:0}
/* ── Shared appbar (same block on every page; var fallbacks let either
   token spelling work) ─────────────────────────────────────────────── */
.appbar{display:flex;align-items:center;gap:16px;padding:11px 18px;background:var(--c1,#141820);border-bottom:1px solid var(--bdr,#232b3b);flex-wrap:wrap}
.appbar .logo{font-weight:700;font-size:15px;letter-spacing:.2px;white-space:nowrap;color:var(--t,#e2e6ec)}
.appbar .logo em{font-style:normal;color:var(--blu,#4da0f8)}
.appbar nav{display:flex;gap:2px;flex-wrap:wrap}
.appbar nav a{padding:5px 11px;border-radius:7px;color:var(--t2,#8090a8);font-size:13px;text-decoration:none}
.appbar nav a:hover{background:var(--c2,#1a2030);color:var(--t,#e2e6ec)}
.appbar nav a.on{background:var(--c2,#1a2030);color:var(--t,#e2e6ec);font-weight:600}
.appbar .ab-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.ab-btn{background:none;border:1px solid var(--bdr,#232b3b);color:var(--t2,#8090a8);border-radius:7px;padding:4px 11px;font-size:13px;cursor:pointer;text-decoration:none}
.ab-btn:hover{color:var(--t,#e2e6ec)}
.ab-user{color:var(--grn,#3dcc6e);font-size:13px;font-weight:600}
.ab-user .role{color:var(--t2,#8090a8);font-weight:400}
.ab-out{color:var(--red,#e8554e);border:1px solid var(--bdr,#232b3b);border-radius:7px;padding:4px 11px;font-size:13px;text-decoration:none}
.ab-out:hover{border-color:var(--red,#e8554e)}
/* Pricing modal (shared rate card across all pages) */
.pm-ov{display:none;position:fixed;inset:0;background:rgba(5,7,10,.72);z-index:60;align-items:flex-start;justify-content:center;padding:40px 14px}
.pm-ov.show{display:flex}
.pm-card{background:var(--c1,#141820);border:1px solid var(--bdr,#232b3b);border-radius:12px;max-width:900px;width:100%;padding:14px 18px;max-height:calc(100vh - 80px);overflow:auto;color:var(--t,#e2e6ec)}
.pm-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.pm-title{font-size:16px;font-weight:700}
.pm-sub{color:var(--t2,#8090a8);font-size:12px}
.pm-opts{margin-left:auto;display:flex;align-items:center;gap:10px;color:var(--t2,#8090a8);font-size:12px}
.pm-close{background:none;border:1px solid var(--bdr,#232b3b);color:var(--t2,#8090a8);border-radius:7px;padding:3px 9px;cursor:pointer}
.pm-body table{width:100%;border-collapse:collapse;font-size:12.5px;text-align:left}
.pm-body th{color:var(--t2,#8090a8);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:6px 8px;border-bottom:1px solid var(--bdr,#232b3b)}
.pm-body td{padding:6px 8px;border-bottom:1px solid var(--bdr,#232b3b)}
.pm-zero{color:var(--t2,#8090a8)}
.pm-host{color:var(--grn,#3dcc6e);font-size:10.5px;margin-left:6px;border:1px solid var(--bdr,#232b3b);border-radius:99px;padding:0 6px}
.pm-list{color:var(--t2,#8090a8);font-size:11px}
</style>
</head>
<body>
<header class="appbar">
  <a class="logo" href="/dashboard">Price<em>Tag</em></a>
  <nav>
    <a href="/dashboard">Usage</a>
    <a href="/manager" id="tab-team" style="display:none" title="Usage for everyone on your team">My team</a>
    <a href="/routing" id="tab-routing" style="display:none">Routing</a>
    <a href="/compression" class="on" style="display:none" id="tab-compression">Compression</a>
    <a href="/admin" id="tab-admin" style="display:none">Admin</a>
  </nav>
  <div class="ab-right">
    <a href="#" id="my-view-btn" class="ab-btn" style="display:none;border-color:var(--blu,#4da0f8);color:var(--blu,#4da0f8)" title="See the dashboard as a regular user would">My view as user</a>
    <button class="ab-btn" onclick="openPricing()">Pricing</button>
    <span class="ab-user" id="abUser" style="display:none"></span>
    <a href="/logout" class="ab-out" id="abOut" style="display:none">Sign out</a>
  </div>
</header>
<div style="display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 100px)">
  <div style="text-align:center;padding:0 16px">
    <div style="font-size:48px;margin-bottom:16px">📊</div>
    <h2 style="margin-bottom:8px;color:var(--cyn)">Headroom Compression Dashboard</h2>
    <p style="color:var(--t2);margin-bottom:24px;max-width:500px">View live compression stats, token savings, engine breakdown, and pipeline timing from the headroom proxy.</p>
    <a id="headroom-link" href="#" target="_blank"
       style="display:inline-block;background:var(--cyn);color:#fff;padding:14px 32px;border-radius:8px;font-size:16px;font-weight:600;text-decoration:none;letter-spacing:.3px;transition:opacity .2s"
       onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">
      Open Dashboard ↗
    </a>
    <p style="color:var(--t2);margin-top:16px;font-size:12px">Opens in a new tab</p>
  </div>
</div>

<!-- Model pricing modal (shared across pages) -->
<div class="pm-ov" id="pricing-ov" onclick="if(event.target===this)closePricing()">
  <div class="pm-card">
    <div class="pm-head">
      <span class="pm-title">Model pricing</span>
      <span class="pm-sub">$ per million tokens</span>
      <span class="pm-opts">
        <label style="display:flex;align-items:center;gap:5px;cursor:pointer"><input type="checkbox" id="pm-all" onchange="loadPricing()" title="Off: only models you have used, plus hosted models. On: every model in the price list, even ones with no usage yet."> Show price list for unused models too</label>
        <button class="pm-close" onclick="closePricing()" aria-label="Close">✕</button>
      </span>
    </div>
    <div class="pm-body" id="pm-body"><div class="pm-sub" style="padding:14px 0">Loading…</div></div>
  </div>
</div>
<script>
var params = new URLSearchParams(window.location.search);
var clusterDomain = window.location.hostname.split('.apps.')[1];
var headroomServiceUrl = params.get('headroom_url') || 'https://headroom-service-openshift-ingress.apps.' + clusterDomain;
document.getElementById('headroom-link').href = headroomServiceUrl + '/dashboard';

// Header identity + role-gated tabs (same convention as every page).
fetch('/api/v1/whoami').then(function(r){return r.json()}).then(function(d){
  if(!d || !d.user) return;
  var ab=document.getElementById('abUser');
  ab.textContent=d.display_name||d.user;
  if(d.isSuperAdmin||d.isAdmin){
    var role=document.createElement('span');
    role.className='role';
    role.textContent=d.isSuperAdmin?' (super admin)':' (admin)';
    ab.appendChild(role);
  }
  document.getElementById('abUser').style.display='';
  document.getElementById('abOut').style.display='';
  if(d.isManager||d.isAdmin)document.getElementById('tab-team').style.display='';
  if(d.isSuperAdmin){
    ['tab-routing','tab-compression','tab-admin'].forEach(function(id){document.getElementById(id).style.display='';});
    var mvb=document.getElementById('my-view-btn');
    mvb.href='/admin/impersonate?as='+encodeURIComponent(d.user);
    mvb.style.display='';
  }
}).catch(function(){});

// ── Model pricing modal (shared rate card across all pages) ─────────
function pmEsc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pmPrice(v){v=+v||0;return v>0?'$'+v.toLocaleString(undefined,{maximumFractionDigits:3}):'<span class="pm-zero">–</span>';}
function openPricing(){document.getElementById('pricing-ov').classList.add('show');loadPricing();}
function closePricing(){document.getElementById('pricing-ov').classList.remove('show');}
function loadPricing(){
  var all=document.getElementById('pm-all').checked;
  var body=document.getElementById('pm-body');
  body.innerHTML='<div class="pm-sub" style="padding:14px 0">Loading…</div>';
  fetch('/api/v1/pricing'+(all?'?used=0':'')).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(j){
    var ms=j.models||[];
    if(!ms.length){body.innerHTML='<div class="pm-sub" style="padding:14px 0">No rates seeded yet.</div>';return;}
    body.innerHTML='<table><thead><tr><th>Model</th><th>Input</th><th>Output</th><th>Cache read</th><th>Cache write</th></tr></thead><tbody>'+
      ms.map(function(m){
        var list=(m.list_input_cost_per_mtok||m.list_output_cost_per_mtok)?'<div class="pm-list">vendor list '+pmPrice(m.list_input_cost_per_mtok)+' / '+pmPrice(m.list_output_cost_per_mtok)+'</div>':'';
        return '<tr><td>'+pmEsc(m.model)+(m.hosted?'<span class="pm-host">hosted</span>':'')+'<div class="pm-list">'+pmEsc(m.provider)+list+'</div></td>'
          +'<td>'+pmPrice(m.input_cost_per_mtok)+'</td><td>'+pmPrice(m.output_cost_per_mtok)+'</td>'
          +'<td>'+pmPrice(m.cache_read_cost_per_mtok)+'</td><td>'+pmPrice(m.cache_write_cost_per_mtok)+'</td></tr>';
      }).join('')+'</tbody></table>';
  }).catch(function(e){body.innerHTML='<div class="pm-sub" style="padding:14px 0;color:var(--red,#e8554e)">Could not load pricing ('+pmEsc(e.message)+').</div>';});
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closePricing();});
</script>
</body>
</html>
